# Publica o release quando uma tag vX.Y.Z sobe para o repositório.
#
# Cada instalador é montado na sua própria máquina: o .deb no Ubuntu, o .exe no
# Windows. O .rpm (Fedora) também é montado no Ubuntu — o GitHub não tem runner
# Fedora — instalando o pacote `rpm` via apt (é ele que fornece o `rpmbuild` que
# o electron-builder usa para gerar o pacote; os nomes das dependências no
# package.json são os do Fedora, não do Ubuntu). Dá para gerar o NSIS a partir
# do Linux, mas só com wine de 32 bits instalado (o rcedit, que grava ícone e
# versão no executável, é um binário ia32) — dependência frágil que não vale
# carregar quando o runner do Windows sai de graça.
name: Release

on:
  push:
    tags: ['v*']
  # Permite republicar os instaladores de uma tag que já existe, sem criar outra.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente a publicar (ex.: v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  empacotar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux (.deb)
            so: ubuntu-latest
            script: dist:linux
            arquivos: dist/*.deb
          - nome: Linux (.rpm Fedora)
            so: ubuntu-latest
            script: dist:fedora
            arquivos: dist/*.rpm
          - nome: Windows (.exe)
            so: windows-latest
            script: dist:win
            arquivos: dist/*.exe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A tag é só um rótulo: quem nomeia os instaladores e grava a versão dentro do
      # executável é o "version" do package.json. Criar a tag antes de subir a versão
      # publica um release vX.Y.Z inteiro com arquivos marcados com a versão ANTERIOR,
      # sem nenhum erro no caminho — foi exatamente o que aconteceu no v1.2.0. Falha
      # aqui, antes de gastar o build.
      - name: Confere se a tag bate com o package.json
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          versao_tag="${TAG#v}"
          versao_pkg="$(node -p "require('./package.json').version")"
          echo "tag: $TAG (versão $versao_tag) · package.json: $versao_pkg"
          if [ "$versao_tag" != "$versao_pkg" ]; then
            echo "::error::A tag $TAG não corresponde à versão $versao_pkg do package.json. Suba a versão no package.json, faça o commit e recrie a tag."
            exit 1
          fi

      # O pacote `rpm` do Ubuntu fornece o `rpmbuild` que o electron-builder precisa
      # para gerar o .rpm (o fpm usa o rpmbuild como backend). Só o job do Fedora
      # precisa dele — os outros seguem como antes.
      - name: Instala o rpmbuild (necessário para o .rpm)
        if: matrix.script == 'dist:fedora'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          rpmbuild --version

      - run: npm install

      # --publish never: ao detectar CI, o electron-builder tenta publicar o release
      # sozinho e aborta pedindo GH_TOKEN. Quem publica aqui é o passo abaixo, com o gh.
      - run: npm run ${{ matrix.script }} -- --publish never

      - name: Publica os instaladores no release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Os jobs correm em paralelo: quem chega primeiro cria o release,
          # os outros só anexam o instalador deles.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" ${{ matrix.arquivos }} --clobber
